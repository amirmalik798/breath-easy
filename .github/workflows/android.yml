name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          # The Android 17 preview package is distributed as android-37.0.
          # AGP looks up compileSdk 37 as android-37, so provide the conventional alias.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle :app:lintDebug

      - name: Print Android lint report
        if: always()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            cat "$report"
          else
            find app/build -iname "*lint*debug*.txt" -o -iname "lint-results*.txt"
          fi

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BreatheEasy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Launch app on Android 17 emulator
        run: |
          set -euo pipefail
          image_package="system-images;android-37.0;google_apis;x86_64"
          sdkmanager --channel=3 "emulator" "$image_package"
          # The Android SDK Manager installs the emulator binary in its own
          # directory; setup-android does not add that directory to PATH.
          export PATH="$ANDROID_HOME/emulator:$PATH"
          command -v emulator

          # Keep AVD creation and emulator lookup on one explicit location.
          # The previous implicit default was not shared consistently by the
          # SDK command-line tools and emulator on hosted runners.
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          printf 'no\n' | avdmanager -v create avd \
            --force \
            --name BreatheEasy_API_37 \
            --package "$image_package" \
            --device pixel_7
          echo "Created AVD files:"
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print
          if [ ! -s "$ANDROID_AVD_HOME/BreatheEasy_API_37.ini" ] || [ ! -d "$ANDROID_AVD_HOME/BreatheEasy_API_37.avd" ]; then
            avdmanager list avd || true
            echo "Android Virtual Device creation did not produce the expected AVD files."
            exit 1
          fi

          emulator -avd BreatheEasy_API_37 -memory 4096 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim > "$RUNNER_TEMP/breathe-easy-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            adb emu kill >/dev/null 2>&1 || kill "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          if ! timeout 180s adb wait-for-device; then
            cat "$RUNNER_TEMP/breathe-easy-emulator.log"
            adb devices -l || true
            echo "Android 17 emulator did not expose an ADB device within 3 minutes."
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 90); do
            if [ "$(timeout 15s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [ "$booted" != true ]; then
            cat "$RUNNER_TEMP/breathe-easy-emulator.log"
            adb logcat -d -t 300 || true
            echo "Android 17 emulator did not finish booting within the 7.5-minute limit."
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          timeout 600s gradle :app:connectedDebugAndroidTest
