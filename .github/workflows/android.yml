name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 preview SDK
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          # The Android 17 preview package is distributed as android-37.0.
          # AGP looks up compileSdk 37 as android-37, so provide the conventional alias.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle :app:lintDebug

      - name: Print Android lint report
        if: always()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            cat "$report"
          else
            find app/build -iname "*lint*debug*.txt" -o -iname "lint-results*.txt"
          fi

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Launch app on Android 17 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 37.0
          system-image-api-level: 37.0
          target: google_apis
          arch: x86_64
          profile: pixel_7
          channel: canary
          emulator-boot-timeout: 900
          script: gradle :app:connectedDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BreatheEasy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
